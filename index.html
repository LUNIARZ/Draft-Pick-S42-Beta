function unavailable(){const s=new Set(S.used);['B','R'].forEach(x=>{G[x].ban.forEach(i=>i&&s.add(i));G[x].pick.forEach(i=>s.add(i))});return s}
function act(id){
  if(G.done||(id&&unavailable().has(id)))return;const [type,side,n]=cur();
  G[side][type].push(id);G.n++;sel=null;
  if(++G.k>=n){G.k=0;G.step++;if(G.step>=PH.length){G.done=true;finish()}}
  render();
  if($('botR').checked&&!G.done&&cur()[1]==='R')setTimeout(()=>{if(!G.done&&cur()[1]==='R')autoAct()},450);
}
function autoAct(){if(G.done)return;const s=G.step;do{const r=recs()[0];act(r?r.h.id:null)}while(!G.done&&G.step===s)}
function confirmSel(){if(sel)act(sel)}
function pickSel(id){sel=sel===id?null:id;renderGrid();renderBar()}

// lane: isi manual dari user, sisanya otomatis (hero flexible)
function entries(s){return G[s].pick.map((id,i)=>id?{i,h:hid(id),m:G.roles[s][i]||null}:null).filter(Boolean)}
function assign(es){const res={},taken=new Set(),own={};es.forEach(e=>{if(e.m){res[e.i]=e.m;taken.add(e.m)}});
  const auto=es.filter(e=>!e.m),tryH=(k,seen)=>{for(const l of auto[k].h.lanes){if(taken.has(l)||seen.has(l))continue;seen.add(l);if(own[l]===undefined||tryH(own[l],seen)){own[l]=k;return true}}return false};
  auto.forEach((e,k)=>tryH(k,new Set()));LANES.forEach(l=>{if(own[l]!==undefined)res[auto[own[l]].i]=l});return res}
const covered=es=>new Set(Object.values(assign(es))).size;
function setRole(s,i,v){G.roles[s][i]=v||null;render();if(G.done)finish()}
const avg=(t,k)=>t.length?t.reduce((s,h)=>s+h[k],0)/t.length:5;

function recs(){const [type,side]=cur(),un=unavailable(),es=entries(side),mine=es.map(e=>e.h),opp=entries(side==='B'?'R':'B').map(e=>e.h),base=covered(es);
  return H.filter(h=>!un.has(h.id)).map(h=>{let sc=h.prio;
    if(type==='pick'){sc+=covered(es.concat({i:-1,h,m:null}))>base?18:-25;sc+=Math.min(4,(h.lanes.length-1)*2);
      DIM.forEach(([k])=>{sc+=h[k]*(mine.length&&avg(mine,k)<5?1:.3)*.6});if(opp.length&&opp.every(o=>!o.roles.some(r=>r==='Tank'||r==='Support'))&&h.burst>=8)sc+=4}
    else sc+=h.br>30?3:0;return{h,sc}}).sort((a,b)=>b.sc-a.sc)}
function needs(side){const es=entries(side),as=assign(es),t=es.map(e=>e.h),left=5-t.length,out=[],un=unavailable(),av2=H.filter(h=>!un.has(h.id)),
  miss=LANES.filter(l=>!es.some(e=>as[e.i]===l)),unp=es.filter(e=>as[e.i]===undefined),inMiss=h=>h.lanes.some(l=>miss.includes(l)),
  top=(f,only)=>av2.filter(h=>!only||only(h)).map(h=>({h,s:f(h)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.h);
  if(unp.length)out.push({c:'warn',t:`Atur lane manual: ${unp.map(e=>esc(e.h.name)).join(', ')}`,s:[]});
  if(miss.length)out.push({c:left?'':'bad',t:`Lane kosong: <b>${miss.join(', ')}</b>${left?` (sisa ${left} slot)`:''}`,s:left?top(h=>h.prio*.5+(inMiss(h)?40:0),inMiss):[]});
  if(t.length>=2){if(!t.some(h=>h.roles.includes('Tank')))out.push({c:'bad',t:'Belum ada Tank atau frontline',s:left?top(h=>h.prio*.5+h.engage*4+(inMiss(h)?8:0),h=>h.roles.includes('Tank')):[]});
    DIM.map(([k,n])=>({k,n,a:avg(t,k)})).filter(x=>x.a<NEED[x.k]).sort((x,y)=>x.a-NEED[x.k]-(y.a-NEED[y.k])).forEach(x=>out.push({c:'',t:`${x.n} kurang (${x.a.toFixed(1)}, target minimal ${NEED[x.k]})`,s:left?top(h=>h.prio*.4+h[x.k]*6+(inMiss(h)?8:0)):[]}))}
  return{out:out.slice(0,6),n:t.length}}

function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='s-'+t))}
function render(){
  $('score').textContent=`G${S.game} · ${S.sc.a}-${S.sc.b}`;
  const [type,side,n]=G.done?[0,0,0]:cur();if(!G.done&&G.step!==lastStep){ns=side;lastStep=G.step}
  $('ribbon').className=G.done?'':side;
  $('phase').textContent=G.done?'Draft selesai':`${type==='ban'?'Ban':'Pick'} ${side==='B'?'Blue':'Red'}`;
  $('hint').textContent=G.done?'Cek tab Hasil, lalu pilih pemenang game.':`${S[side==='B'?blueKey():redKey()]} ${type==='ban'?'memilih hero untuk di-ban':n-G.k>1?'memilih 2 hero sekaligus':'memilih 1 hero'}`;
  $('prog').innerHTML=ACTS.map((s,i)=>`<i class="${s} ${i<G.n?'d':''} ${!G.done&&i===G.n?'now':''}"></i>`).join('');
  team('sb','B',S[blueKey()]);team('sr','R',S[redKey()]);renderNeeds();renderGrid();renderBar();
  $('rec').innerHTML=G.done?'':recs().slice(0,6).map(x=>`<span class="chip" onclick="pickSel(${x.h.id})">${esc(x.h.name)} <span class="t t${x.h.tier}">${x.h.tier}</span> <small>${x.h.lanes.join('/')}</small></span>`).join('')}
function team(el,s,name){const es=entries(s),as=assign(es),[type,side]=G.done?[0,0]:cur(),turn=!G.done&&side===s;
  $(el).className='tm '+s+(turn?' turn':'');let h=`<h2>${esc(name)}</h2><div class="bans">`;
  for(let i=0;i<3;i++){const id=G[s].ban[i];h+=id?`<span class="av" style="--h:${HUE[hid(id).role]}" title="${esc(hid(id).name)}">${esc(hid(id).name.slice(0,2))}</span>`:`<span class="em ${turn&&type==='ban'&&i===G[s].ban.length?'now':''}"></span>`}
  h+='</div>';
  for(let i=0;i<5;i++){const id=G[s].pick[i],x=id&&hid(id),now=turn&&type==='pick'&&i>=G[s].pick.length&&i<G[s].pick.length+cur()[2]-G.k;
    h+=`<div class="pk ${now?'now':''}">`+(x?`${av(x)}<div><b>${esc(x.name)}</b><small>${x.roles.join('/')}</small></div><select aria-label="Lane ${esc(x.name)}" onchange="setRole('${s}',${i},this.value)"><option value="">Auto (${as[i]||'?'})</option>${LANES.map(l=>`<option ${G.roles[s][i]===l?'selected':''}>${l}</option>`).join('')}</select>`:`<span class="em">Pick ${i+1}</span>`)+'</div>'}
  $(el).innerHTML=h}
function renderNeeds(){const r=needs(ns),B=S[blueKey()],R=S[redKey()];
  $('needs').innerHTML=`<div class="seg"><button class="${ns==='B'?'on':''}" onclick="ns='B';renderNeeds()">Blue: ${esc(B)}</button><button class="${ns==='R'?'on':''}" onclick="ns='R';renderNeeds()">Red: ${esc(R)}</button></div>`
  +(!r.n?'<small>Belum ada pick. Kekurangan tim muncul setelah pick pertama.</small>':!r.out.length?'<div class="ok">Komposisi seimbang, tidak ada kekurangan utama.</div>'
  :r.out.map(x=>`<div class="need"><div class="${x.c}">${x.t}</div>${x.s.length?`<div class="sg"><small>Saran:</small>${x.s.map(h=>`<span class="chip" onclick="pickSel(${h.id});tab('hero')">${esc(h.name)}</span>`).join('')}</div>`:''}</div>`).join(''))}
function renderGrid(){const q=$('q').value.toLowerCase(),fl=$('fl').value,so=$('so').value,un=unavailable();
  $('grid').innerHTML=H.filter(h=>h.name.toLowerCase().includes(q)&&(!fl||h.lanes.includes(fl))).sort((a,b)=>so==='name'?a.name.localeCompare(b.name):b[so]-a[so])
  .map(h=>`<div class="hero ${un.has(h.id)||G.done?'x':''} ${sel===h.id?'sel':''}" onclick="pickSel(${h.id})"><span class="t t${h.tier}">${h.tier}</span>${av(h)}<b>${esc(h.name)}</b><i>${h.lanes.join('/')}</i><i>WR ${h.wr} · P ${h.pr} · B ${h.br}</i></div>`).join('')}
function renderBar(){const b=$('ok'),hh=sel&&hid(sel);if(G.done){$('sn').innerHTML='<small>Draft selesai</small>';b.disabled=true;b.textContent='Selesai';b.className='';return}
  const [type,side]=cur();$('sn').innerHTML=hh?`<b>${esc(hh.name)}</b> <small>${hh.lanes.join('/')}</small>`:`<small>Pilih hero untuk ${type} ${side==='B'?'Blue':'Red'}</small>`;
  b.disabled=!hh;b.textContent=type==='ban'?'Ban':'Pick';b.className=type}

function tf(side){const es=entries(side),t=es.map(e=>e.h),as=assign(es),d={};DIM.forEach(([k])=>d[k]=avg(t,k));
  const score=Math.round((d.engage*.25+d.cc*.25+d.burst*.2+d.sustain*.15+d.aoe*.15)*10),lanes=LANES.filter(l=>!es.some(e=>as[e.i]===l)),note=[];
  if(d.engage<4.5)note.push(['bad','Engage lemah, sulit membuka teamfight']);else if(d.engage>=6)note.push(['ok','Engage kuat']);
  if(d.cc<4.5)note.push(['bad','Crowd control kurang']);else if(d.cc>=5.5)note.push(['ok','CC cukup untuk mengunci target']);
  if(d.sustain<3.5)note.push(['bad','Minim sustain/peel, rawan kehabisan di fight panjang']);
  if(d.burst>=6.5)note.push(['ok','Burst tinggi, kuat menghabisi target prioritas']);if(d.aoe>=5.5)note.push(['ok','AoE damage bagus']);
  if(!t.some(h=>h.roles.includes('Tank')))note.push(['bad','Tanpa Tank atau frontline']);if(lanes.length)note.push(['bad','Lane kosong: '+lanes.join(', ')]);
  return{score,d,note,lineup:es.map(e=>`${e.h.name} (${as[e.i]||'?'})`).join(', ')}}
function finish(){const b=tf('B'),r=tf('R'),box=(x,l,c)=>`<div class="sc" style="color:${c}">${x.score}</div><b>${esc(l)}</b><br><small>${esc(x.lineup)}</small><div style="margin-top:8px">`
  +DIM.map(([k,n])=>`<div class="row"><span>${n}</span><span>${x.d[k].toFixed(1)}</span></div><div class="bar"><span style="width:${x.d[k]*10}%;background:${c}"></span></div>`).join('')+'</div><ul>'+x.note.map(n=>`<li class="${n[0]}">${n[1]}</li>`).join('')+'</ul>',
  diff=b.score-r.score;G.tf={B:b.score,R:r.score};
  $('an').innerHTML=box(b,'Blue: '+S[blueKey()],'var(--bl)')+box(r,'Red: '+S[redKey()],'var(--rd)')+`<p>Prediksi teamfight: <b>${Math.abs(diff)<3?'seimbang':diff>0?'Blue unggul':'Red unggul'}</b> (selisih ${Math.abs(diff)})</p><div style="display:flex;gap:8px"><button style="flex:1" onclick="win('B')">Blue menang</button><button style="flex:1" onclick="win('R')">Red menang</button></div>`;tab('res')}
function win(w){const wk=w==='B'?blueKey():redKey(),bans=[...G.B.ban,...G.R.ban].filter(Boolean).map(i=>hid(i).name).join(', ');
  const hs=store.get();hs.unshift({a:S.a,b:S.b,g:S.game,w:S[wk],tf:`${G.tf.B}-${G.tf.R}`,bans,t:Date.now()});store.set(hs.slice(0,40));S.sc[wk]++;
  if(S.fear)G.B.pick.concat(G.R.pick).forEach(i=>S.used.push(i));renderHist();
  if(S.sc.a===2||S.sc.b===2||S.game===3){$('an').innerHTML=`<div class="sc">${esc(S.sc.a>S.sc.b?S.a:S.b)} menang Bo3</div><p>Skor akhir ${S.sc.a}-${S.sc.b}. Buka Pengaturan untuk memulai Bo3 baru.</p>`;render();return}
  S.game++;newGame()}
function renderHist(){const hs=store.get();$('hist').innerHTML=hs.length?hs.map(g=>`<div class="hi"><b>${esc(g.a)} vs ${esc(g.b)}</b> · G${g.g} · menang ${esc(g.w)} · TF ${g.tf}<br><small>Ban: ${esc(g.bans||'-')}</small></div>`).join('')+'<button onclick="store.set([]);renderHist()" style="margin-top:8px">Hapus riwayat</button>':'<small>Belum ada game tersimpan. Riwayat disimpan di browser ini.</small>'}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
['q','fl','so'].forEach(i=>$(i).addEventListener('input',renderGrid));
$('auto').onclick=autoAct;$('newBtn').onclick=newSeries;
$('w').oninput=e=>{W=+e.target.value/100;$('wv').textContent=`${e.target.value}/${100-e.target.value}`;calc();if(G)render()};
calc();renderHist();newSeries();
</script></body></html>
